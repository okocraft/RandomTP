name: Java CI
on: [ push, pull_request ]

jobs:
  build-java-25:
    uses: okocraft/workflows/.github/workflows/maven.yml@v1
    with:
      java-version: '25'
      package-name: RandomTP-Build-${{ github.run_number }}

  wrapper:
    name: Maven Wrapper (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
      - name: Check Unix wrapper
        if: runner.os != 'Windows'
        run: ./mvnw --batch-mode --version
      - name: Check Windows wrapper
        if: runner.os == 'Windows'
        run: ./mvnw.cmd --batch-mode --version
